# Detach from the parent ventstream workspace — this example is a
# self-contained reference, not part of the production build, and
# shouldn't inherit the workspace's strict lints (panic-deny etc.).
[workspace]

[package]
name = "neo4j-cdc-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
neo4rs = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
chrono = "0.4"

[[bin]]
name = "spike"
path = "src/main.rs"
