global
  maxconn 128

defaults
  mode tcp
  timeout connect 1s
  timeout client 30s
  timeout server 30s

listen redis
  bind *:6379
  option tcp-check
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  server primary ventstream-redis-sink-primary:6379 check inter 100ms fall 1 rise 1
  server replica ventstream-redis-sink-replica:6379 check inter 100ms fall 1 rise 1 backup
