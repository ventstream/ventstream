  </defs>
  <rect width="1240" height="190" rx="18" fill="#0A0E0C"/>
  <rect x="0.5" y="0.5" width="1239" height="189" rx="17.5" stroke="#1C2620"/>

  <rect x="64" y="62" width="212" height="66" rx="11" fill="url(#cfBlue)" stroke="#3D5A78"/>
  <text x="170" y="91" font-size="13" font-weight="600" fill="#DCE6EE" text-anchor="middle">Change event</text>
  <text x="170" y="110" font-size="10.5" fill="#66788A" text-anchor="middle">insert · update · delete</text>

  <rect x="356" y="62" width="252" height="66" rx="11" fill="url(#cfGreen)" stroke="#2FCF88" stroke-opacity="0.5"/>
