<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="VentStream architecture: one Rust binary with a change-streaming pipeline, a real-time socket-delivery pipeline, and an MCP serving surface for AI agents">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2fcf88"/>
    </marker>
    <style>
      .bg{fill:#0b1220;stroke:#1e293b;stroke-width:1.5}
      .box{fill:#111a2e;stroke:#31445f;stroke-width:1.5;rx:10}
      .eng{fill:#0d2a20;stroke:#2fcf88;stroke-width:2;rx:12}
      .t{fill:#e6edf3;font-size:14px;font-weight:600}
      .s{fill:#8aa0b8;font-size:11.5px}
      .lane{fill:#7ee6b8;font-size:13px;font-weight:700;letter-spacing:.3px}
      .cap{fill:#64748b;font-size:11.5px}
      .ln{stroke:#2fcf88;stroke-width:1.6;fill:none;opacity:.85}
      .title{fill:#e6edf3;font-size:30px;font-weight:800}
      .sub{fill:#94a3b8;font-size:14px}
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="978" height="698" rx="18"/>
  <text class="title" x="34" y="50">VentStream</text>
  <text class="sub" x="248" y="50">one Rust binary · change streaming + real-time delivery + AI access</text>

  <!-- Lane 1: CDC -->
  <text class="lane" x="34" y="96">① Change streaming → any target</text>

  <rect class="box" x="34" y="112" width="132" height="38" rx="10"/>
  <text class="t" x="100" y="129" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="100" y="143" text-anchor="middle">incl. Supabase</text>
  <rect class="box" x="34" y="158" width="132" height="38" rx="10"/>
  <text class="t" x="100" y="175" text-anchor="middle">MySQL / MariaDB</text>
  <text class="s" x="100" y="189" text-anchor="middle">row-based binlog</text>
  <rect class="box" x="34" y="204" width="132" height="38" rx="10"/>
  <text class="t" x="100" y="221" text-anchor="middle">MongoDB</text>
  <text class="s" x="100" y="235" text-anchor="middle">change streams</text>
  <rect class="box" x="34" y="250" width="132" height="38" rx="10"/>
  <text class="t" x="100" y="267" text-anchor="middle">Neo4j</text>
  <text class="s" x="100" y="281" text-anchor="middle">CDC log</text>
  <rect class="box" x="34" y="296" width="132" height="38" rx="10"/>
  <text class="t" x="100" y="313" text-anchor="middle">Kafka</text>
  <text class="s" x="100" y="327" text-anchor="middle">Debezium / raw</text>

  <rect class="eng" x="382" y="172" width="196" height="100" rx="12"/>
  <text class="t" x="480" y="200" text-anchor="middle">VentStream · cdc</text>
  <text class="s" x="480" y="220" text-anchor="middle">bootstrap + tail, one motion</text>
  <text class="s" x="480" y="236" text-anchor="middle">joins → composed documents</text>
  <text class="s" x="480" y="252" text-anchor="middle">deterministic ids, durable cursor</text>

  <rect class="box" x="788" y="118" width="158" height="44" rx="10"/>
  <text class="t" x="867" y="137" text-anchor="middle">OpenSearch</text>
  <text class="s" x="867" y="152" text-anchor="middle">/ Elasticsearch</text>
  <rect class="box" x="788" y="172" width="158" height="44" rx="10"/>
  <text class="t" x="867" y="191" text-anchor="middle">Meilisearch</text>
  <text class="s" x="867" y="206" text-anchor="middle">task-confirmed</text>
  <rect class="box" x="788" y="226" width="158" height="44" rx="10"/>
  <text class="t" x="867" y="245" text-anchor="middle">Redis</text>
  <text class="s" x="867" y="260" text-anchor="middle">keyspace / views</text>
  <rect class="box" x="788" y="280" width="158" height="44" rx="10"/>
  <text class="t" x="867" y="299" text-anchor="middle">SurrealDB</text>
  <text class="s" x="867" y="314" text-anchor="middle">record ids · graph edges</text>

  <path class="ln" d="M166 131 L382 200" marker-end="url(#ar)"/>
  <path class="ln" d="M166 177 L382 212" marker-end="url(#ar)"/>
  <path class="ln" d="M166 223 L382 224" marker-end="url(#ar)"/>
  <path class="ln" d="M166 269 L382 236" marker-end="url(#ar)"/>
  <path class="ln" d="M166 315 L382 248" marker-end="url(#ar)"/>
  <path class="ln" d="M578 200 L788 140" marker-end="url(#ar)"/>
  <path class="ln" d="M578 214 L788 194" marker-end="url(#ar)"/>
  <path class="ln" d="M578 230 L788 248" marker-end="url(#ar)"/>
  <path class="ln" d="M578 244 L788 302" marker-end="url(#ar)"/>
  <text class="cap" x="666" y="161" text-anchor="middle">idempotent, bounded</text>

  <!-- divider -->
  <line x1="34" y1="368" x2="946" y2="368" stroke="#1e293b" stroke-width="1"/>

  <!-- Lane 2: real-time -->
  <text class="lane" x="34" y="404">② Real-time socket delivery → clients</text>
  <rect class="box" x="34" y="422" width="132" height="48" rx="10"/>
  <text class="t" x="100" y="444" text-anchor="middle">Publishers</text>
  <text class="s" x="100" y="460" text-anchor="middle">{event, id, data}</text>

  <rect class="box" x="214" y="422" width="150" height="48" rx="10"/>
  <text class="t" x="289" y="444" text-anchor="middle">Broker</text>
  <text class="s" x="289" y="460" text-anchor="middle">NATS · JetStream · Redis</text>

  <rect class="eng" x="404" y="420" width="182" height="52" rx="12"/>
  <text class="t" x="495" y="442" text-anchor="middle">VentStream</text>
  <text class="s" x="495" y="458" text-anchor="middle">ws · graphql roles</text>

  <rect class="box" x="788" y="410" width="158" height="40" rx="10"/>
  <text class="t" x="867" y="435" text-anchor="middle">WebSocket clients</text>
  <rect class="box" x="788" y="458" width="158" height="40" rx="10"/>
  <text class="t" x="867" y="483" text-anchor="middle">Apollo / GraphQL</text>

  <path class="ln" d="M166 446 L214 446" marker-end="url(#ar)"/>
  <path class="ln" d="M364 446 L404 446" marker-end="url(#ar)"/>
  <path class="ln" d="M578 440 L788 430" marker-end="url(#ar)"/>
  <path class="ln" d="M578 452 L788 478" marker-end="url(#ar)"/>

  <!-- divider -->
  <line x1="34" y1="524" x2="946" y2="524" stroke="#1e293b" stroke-width="1"/>

  <!-- Lane 3: MCP -->
  <text class="lane" x="34" y="560">③ AI access → agents</text>
  <rect class="box" x="34" y="578" width="150" height="48" rx="10"/>
  <text class="t" x="109" y="600" text-anchor="middle">Materialized docs</text>
  <text class="s" x="109" y="616" text-anchor="middle">Redis · search indexes</text>

  <rect class="eng" x="404" y="576" width="182" height="52" rx="12"/>
  <text class="t" x="495" y="598" text-anchor="middle">VentStream · mcp</text>
  <text class="s" x="495" y="614" text-anchor="middle">read-only tools, scoped keys</text>

  <rect class="box" x="788" y="578" width="158" height="48" rx="10"/>
  <text class="t" x="867" y="600" text-anchor="middle">AI agents</text>
  <text class="s" x="867" y="616" text-anchor="middle">Claude · any MCP client</text>

  <path class="ln" d="M184 602 L404 602" marker-end="url(#ar)"/>
  <path class="ln" d="M586 602 L788 602" marker-end="url(#ar)"/>
  <text class="cap" x="687" y="646" text-anchor="middle">answers reflect the source in seconds</text>

  <text class="cap" x="490" y="676" text-anchor="middle">role-selected on one binary — roles: [cdc, ws, graphql, mcp]</text>
</svg>
