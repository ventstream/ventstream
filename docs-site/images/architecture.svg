<svg width="1240" height="880" viewBox="0 0 1240 880" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#243129" opacity="0.5"/>
    </pattern>
    <linearGradient id="pillGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17281F"/>
      <stop offset="100%" stop-color="#0E1713"/>
    </linearGradient>
    <linearGradient id="pillBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14212E"/>
      <stop offset="100%" stop-color="#0D141C"/>
    </linearGradient>
    <linearGradient id="pillSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2027"/>
      <stop offset="100%" stop-color="#10151B"/>
    </linearGradient>
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2FCF88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2FCF88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- canvas -->
  <rect width="1240" height="880" rx="20" fill="#0A0E0C"/>
  <rect x="0.5" y="0.5" width="1239" height="879" rx="19.5" stroke="#1C2620"/>

  <!-- ── VentStream Cloud ─────────────────────────────── -->
  <rect x="340" y="56" width="560" height="208" rx="16" fill="#0D1210" stroke="#232E28"/>
  <rect x="340" y="56" width="560" height="208" rx="16" fill="url(#dots)"/>
  <text x="620" y="92" font-size="15" font-weight="600" fill="#C7D4CC" text-anchor="middle">VentStream Cloud</text>

  <g font-size="12.5" fill="#B9C4CF" text-anchor="middle">
    <rect x="372" y="112" width="240" height="50" rx="10" fill="url(#pillSlate)" stroke="#55636F"/>
    <text x="492" y="142">Control API</text>
    <rect x="628" y="112" width="240" height="50" rx="10" fill="url(#pillSlate)" stroke="#55636F"/>
    <text x="748" y="142">Agent gateway</text>
    <rect x="372" y="182" width="240" height="50" rx="10" fill="url(#pillSlate)" stroke="#55636F"/>
    <text x="492" y="212">Durable operations</text>
    <rect x="628" y="182" width="240" height="50" rx="10" fill="url(#pillSlate)" stroke="#55636F"/>
    <text x="748" y="212">Fleet Postgres</text>
  </g>

  <!-- spine: cloud → environment -->
  <line x1="620" y1="264" x2="620" y2="336" stroke="#4A5A52" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="636" y="296" font-size="10.5" fill="#71837A">outbound mTLS</text>
  <text x="636" y="311" font-size="10.5" fill="#4E5D55">desired state only</text>

  <!-- ── Your environment ─────────────────────────────── -->
  <rect x="280" y="336" width="680" height="356" rx="16" fill="#0C120F" stroke="#232E28"/>
  <rect x="280" y="336" width="680" height="356" rx="16" fill="url(#dots)"/>
  <text x="620" y="372" font-size="15" font-weight="600" fill="#C7D4CC" text-anchor="middle">Your environment</text>

  <!-- engine pill -->
  <ellipse cx="620" cy="424" rx="250" ry="64" fill="url(#engineGlow)"/>
  <rect x="452" y="398" width="336" height="54" rx="11" fill="url(#pillGreen)" stroke="#2FCF88" stroke-width="1.4"/>
  <text x="620" y="430" font-size="14" font-weight="650" fill="#E9F4EE" text-anchor="middle">VentStream Engine</text>

  <!-- engine capabilities -->
  <g font-size="12.5" fill="#BFD2C8" text-anchor="middle">
    <rect x="318" y="484" width="292" height="50" rx="10" fill="url(#pillGreen)" stroke="#2FCF88" stroke-opacity="0.42"/>
    <text x="464" y="514">Capture · CDC</text>
    <rect x="630" y="484" width="292" height="50" rx="10" fill="url(#pillGreen)" stroke="#2FCF88" stroke-opacity="0.42"/>
    <text x="776" y="514">Projection · joins</text>
    <rect x="318" y="554" width="292" height="50" rx="10" fill="url(#pillGreen)" stroke="#2FCF88" stroke-opacity="0.42"/>
    <text x="464" y="584">ACK-gated delivery</text>
    <rect x="630" y="554" width="292" height="50" rx="10" fill="url(#pillGreen)" stroke="#2FCF88" stroke-opacity="0.42"/>
    <text x="776" y="584">Real-time fan-out</text>
  </g>

  <!-- environment footnote -->
  <text x="620" y="660" font-size="11" fill="#66786E" text-anchor="middle">durable local state · cursors · dead-letter queue · keys</text>

  <!-- ── Sources (left column) ────────────────────────── -->
  <text x="168" y="368" font-size="11" font-weight="600" fill="#7E93A8" letter-spacing="1.6" text-anchor="middle">SOURCES</text>
  <g font-size="12.5" fill="#B9CBDD" text-anchor="middle">
    <rect x="64" y="388" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="168" y="416">PostgreSQL</text>
    <rect x="64" y="450" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="168" y="478">MySQL</text>
    <rect x="64" y="512" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="168" y="540">MongoDB</text>
    <rect x="64" y="574" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="168" y="602">Neo4j</text>
    <rect x="64" y="636" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="168" y="664">Kafka · Debezium</text>
  </g>
  <!-- left connectors: collector + elbow into engine row -->
  <g stroke="#3A4A42" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="272" y1="411" x2="296" y2="411"/>
    <line x1="272" y1="473" x2="296" y2="473"/>
    <line x1="272" y1="535" x2="296" y2="535"/>
    <line x1="272" y1="597" x2="296" y2="597"/>
    <line x1="272" y1="659" x2="296" y2="659"/>
    <line x1="296" y1="411" x2="296" y2="659"/>
    <line x1="296" y1="514" x2="318" y2="514"/>
  </g>

  <!-- ── Targets & clients (right column) ─────────────── -->
  <text x="1072" y="368" font-size="11" font-weight="600" fill="#7E93A8" letter-spacing="1.6" text-anchor="middle">TARGETS &amp; CLIENTS</text>
  <g font-size="12.5" fill="#B9CBDD" text-anchor="middle">
    <rect x="968" y="388" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="1072" y="416">OpenSearch</text>
    <rect x="968" y="450" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="1072" y="478">Elasticsearch</text>
    <rect x="968" y="512" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="1072" y="540">Meilisearch</text>
    <rect x="968" y="574" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="1072" y="602">Redis</text>
    <rect x="968" y="636" width="208" height="46" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="1072" y="664">Browsers &amp; apps</text>
  </g>
  <!-- right connectors -->
  <g stroke="#3A4A42" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="944" y1="411" x2="968" y2="411"/>
    <line x1="944" y1="473" x2="968" y2="473"/>
    <line x1="944" y1="535" x2="968" y2="535"/>
    <line x1="944" y1="597" x2="968" y2="597"/>
    <line x1="944" y1="659" x2="968" y2="659"/>
    <line x1="944" y1="411" x2="944" y2="659"/>
    <line x1="922" y1="514" x2="944" y2="514"/>
  </g>

  <!-- ── Brokers (bottom) ─────────────────────────────── -->
  <line x1="620" y1="692" x2="620" y2="744" stroke="#3A4A42" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round"/>
  <g font-size="12.5" fill="#B9CBDD" text-anchor="middle">
    <rect x="452" y="744" width="336" height="50" rx="10" fill="url(#pillBlue)" stroke="#3D5A78"/>
    <text x="620" y="774">NATS · Redis Streams</text>
  </g>
  <text x="620" y="820" font-size="11" fill="#66786E" text-anchor="middle">event brokers for real-time delivery · live or replayable</text>

  <!-- caption -->
  <text x="1176" y="846" font-size="13" font-weight="600" fill="#93A69B" text-anchor="end">VentStream architecture overview</text>
</svg>
