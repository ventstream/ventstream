<svg width="1240" height="836" viewBox="0 0 1240 836" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#173226" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0A100D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="engineEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2FCF88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2FCF88" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="aGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 0.8 L7.2 4 L0.5 7.2 Z" fill="#2FCF88"/>
    </marker>
    <marker id="aSlate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 0.8 L7.2 4 L0.5 7.2 Z" fill="#7D8B9F"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1240" height="836" rx="18" fill="#0A100D"/>
  <rect width="1240" height="836" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1239" height="835" rx="17.5" stroke="#1D2822"/>

  <!-- header -->
  <text x="48" y="66" font-size="21" font-weight="650" fill="#ECF3EE" letter-spacing="-0.2">VentStream architecture</text>
  <text x="48" y="90" font-size="12.5" fill="#8CA096">One engine binary. Your data stays in your environment; the control plane only carries intent.</text>

  <!-- legend -->
  <g font-size="11" fill="#8CA096">
    <circle cx="962" cy="61" r="4" fill="#2FCF88"/>
    <text x="974" y="65">data path</text>
    <circle cx="1062" cy="61" r="4" fill="#7D8B9F"/>
    <text x="1074" y="65">control path</text>
  </g>

  <!-- ── management plane ─────────────────────────────────────── -->
  <rect x="48" y="112" width="1144" height="164" rx="14" fill="#0E1613" stroke="#212D26"/>
  <text x="72" y="141" font-size="10.5" font-weight="600" fill="#7D8B9F" letter-spacing="1.6">VENTSTREAM CLOUD · MANAGEMENT PLANE</text>
  <text x="1168" y="141" font-size="10.5" fill="#5C6B62" text-anchor="end">inventory · desired state · operations · audit</text>

  <!-- cloud nodes -->
  <g>
    <rect x="72" y="160" width="196" height="72" rx="10" fill="#121B17" stroke="#26332C"/>
    <text x="92" y="188" font-size="12.5" font-weight="600" fill="#DCE6E0">ventstreamctl · Dashboard</text>
    <text x="92" y="208" font-size="10.5" fill="#7E9187">operators and automation</text>

    <rect x="316" y="160" width="180" height="72" rx="10" fill="#121B17" stroke="#26332C"/>
    <text x="336" y="188" font-size="12.5" font-weight="600" fill="#DCE6E0">Control API</text>
    <text x="336" y="208" font-size="10.5" fill="#7E9187">authz · idempotent · audited</text>

    <rect x="544" y="160" width="180" height="72" rx="10" fill="#121B17" stroke="#26332C"/>
    <text x="564" y="188" font-size="12.5" font-weight="600" fill="#DCE6E0">Control worker</text>
    <text x="564" y="208" font-size="10.5" fill="#7E9187">durable operations</text>

    <rect x="772" y="160" width="160" height="72" rx="10" fill="#121B17" stroke="#26332C"/>
    <text x="792" y="188" font-size="12.5" font-weight="600" fill="#DCE6E0">Postgres</text>
    <text x="792" y="208" font-size="10.5" fill="#7E9187">tenant-isolated · RLS</text>

    <rect x="980" y="160" width="184" height="72" rx="10" fill="#121B17" stroke="#26332C"/>
    <text x="1000" y="188" font-size="12.5" font-weight="600" fill="#DCE6E0">Agent gateway</text>
    <text x="1000" y="208" font-size="10.5" fill="#7E9187">mTLS identity · fenced</text>
  </g>

  <!-- cloud connectors -->
  <g stroke="#7D8B9F" stroke-width="1.4">
    <line x1="268" y1="196" x2="308" y2="196" marker-end="url(#aSlate)"/>
    <line x1="496" y1="196" x2="536" y2="196" marker-end="url(#aSlate)"/>
    <line x1="724" y1="196" x2="764" y2="196" marker-end="url(#aSlate)"/>
    <line x1="932" y1="196" x2="972" y2="196" marker-end="url(#aSlate)"/>
  </g>

  <!-- control drop: gateway → supervisor -->
  <path d="M1072 232 V300" stroke="#7D8B9F" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#aSlate)"/>
  <text x="1086" y="262" font-size="10.5" fill="#7D8B9F">outbound mTLS</text>
  <text x="1086" y="277" font-size="10.5" fill="#5C6B62">desired state only</text>

  <!-- ── data plane ───────────────────────────────────────────── -->
  <rect x="48" y="300" width="1144" height="470" rx="14" fill="#0D1411" stroke="#212D26"/>
  <text x="72" y="329" font-size="10.5" font-weight="600" fill="#2FCF88" letter-spacing="1.6">YOUR ENVIRONMENT · DATA PLANE</text>
  <text x="1168" y="329" font-size="10.5" fill="#5C6B62" text-anchor="end">records, documents, events, and secrets never leave</text>

  <!-- supervisor strip -->
  <rect x="356" y="348" width="520" height="38" rx="9" fill="#101915" stroke="#26332C"/>
  <text x="376" y="372" font-size="11.5" font-weight="600" fill="#B9C7BF">Fleet supervisor · PID 1</text>
  <text x="856" y="372" font-size="10.5" fill="#7E9187" text-anchor="end">stages validated config · restarts the engine</text>

  <!-- sources -->
  <rect x="72" y="410" width="224" height="182" rx="10" fill="#121B17" stroke="#26332C"/>
  <text x="92" y="438" font-size="12.5" font-weight="600" fill="#DCE6E0">Sources</text>
  <g font-size="11" fill="#93A79C">
    <text x="92" y="464">PostgreSQL <tspan fill="#5C6B62">· logical replication</tspan></text>
    <text x="92" y="486">MySQL <tspan fill="#5C6B62">· binlog</tspan></text>
    <text x="92" y="508">MongoDB <tspan fill="#5C6B62">· change streams</tspan></text>
    <text x="92" y="530">Neo4j <tspan fill="#5C6B62">· CDC + Cypher</tspan></text>
    <text x="92" y="552">Kafka <tspan fill="#5C6B62">· Debezium topics</tspan></text>
  </g>
  <text x="92" y="578" font-size="10" fill="#5C6B62">TLS · native cursors</text>

  <!-- engine (CDC role) -->
  <rect x="356" y="410" width="520" height="118" rx="12" fill="#0F1A15" stroke="url(#engineEdge)" stroke-width="1.5"/>
  <text x="376" y="438" font-size="10.5" font-weight="600" fill="#2FCF88" letter-spacing="1.4">VENTSTREAM ENGINE · CDC</text>
  <g>
    <rect x="376" y="452" width="148" height="56" rx="8" fill="#14211B"/>
    <text x="394" y="476" font-size="12" font-weight="600" fill="#DCE6E0">Capture</text>
    <text x="394" y="494" font-size="10.5" fill="#7E9187">snapshot, then tail</text>

    <rect x="542" y="452" width="148" height="56" rx="8" fill="#14211B"/>
    <text x="560" y="476" font-size="12" font-weight="600" fill="#DCE6E0">Project</text>
    <text x="560" y="494" font-size="10.5" fill="#7E9187">joins · document shape</text>

    <rect x="708" y="452" width="148" height="56" rx="8" fill="#14211B"/>
    <text x="726" y="476" font-size="12" font-weight="600" fill="#DCE6E0">Deliver</text>
    <text x="726" y="494" font-size="10.5" fill="#7E9187">ACK-gated cursor · DLQ</text>
  </g>
  <g stroke="#2FCF88" stroke-width="1.4" opacity="0.7">
    <line x1="524" y1="480" x2="536" y2="480" marker-end="url(#aGreen)"/>
    <line x1="690" y1="480" x2="702" y2="480" marker-end="url(#aGreen)"/>
  </g>

  <!-- durable state strip -->
  <rect x="356" y="548" width="520" height="44" rx="9" fill="none" stroke="#26332C" stroke-dasharray="3 5"/>
  <text x="376" y="575" font-size="10.5" fill="#7E9187">Durable local state on your volume — cursors · join state · dead-letter queue · keys</text>

  <!-- targets -->
  <rect x="936" y="410" width="228" height="182" rx="10" fill="#121B17" stroke="#26332C"/>
  <text x="956" y="438" font-size="12.5" font-weight="600" fill="#DCE6E0">Search &amp; serving stores</text>
  <g font-size="11" fill="#93A79C">
    <text x="956" y="466">OpenSearch <tspan fill="#5C6B62">/ Elasticsearch</tspan></text>
    <text x="956" y="490">Meilisearch</text>
    <text x="956" y="514">Redis</text>
  </g>
  <text x="956" y="548" font-size="10" fill="#5C6B62">deterministic ids · idempotent</text>
  <text x="956" y="566" font-size="10" fill="#5C6B62">upserts · exact deletes</text>

  <!-- CDC flow arrows -->
  <line x1="296" y1="469" x2="348" y2="469" stroke="#2FCF88" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <line x1="876" y1="469" x2="928" y2="469" stroke="#2FCF88" stroke-width="1.6" marker-end="url(#aGreen)"/>

  <!-- realtime row -->
  <text x="72" y="634" font-size="10.5" font-weight="600" fill="#7E9187" letter-spacing="1.4">REAL-TIME DELIVERY</text>
  <rect x="72" y="648" width="224" height="76" rx="10" fill="#121B17" stroke="#26332C"/>
  <text x="92" y="676" font-size="12.5" font-weight="600" fill="#DCE6E0">Your services</text>
  <text x="92" y="696" font-size="10.5" fill="#7E9187">publish domain events once</text>

  <rect x="356" y="648" width="180" height="76" rx="10" fill="#121B17" stroke="#26332C"/>
  <text x="376" y="676" font-size="12.5" font-weight="600" fill="#DCE6E0">NATS · Redis</text>
  <text x="376" y="696" font-size="10.5" fill="#7E9187">live or replayable</text>

  <rect x="596" y="648" width="280" height="76" rx="10" fill="#0F1A15" stroke="url(#engineEdge)" stroke-width="1.5"/>
  <text x="616" y="672" font-size="10.5" font-weight="600" fill="#2FCF88" letter-spacing="1.4">VENTSTREAM ENGINE · REALTIME</text>
  <text x="616" y="694" font-size="11.5" fill="#B9C7BF">WebSocket gateway · GraphQL subscriptions</text>
  <text x="616" y="712" font-size="10.5" fill="#7E9187">fan-out to any number of subscribers</text>

  <rect x="936" y="648" width="228" height="76" rx="10" fill="#121B17" stroke="#26332C"/>
  <text x="956" y="676" font-size="12.5" font-weight="600" fill="#DCE6E0">Browsers &amp; apps</text>
  <text x="956" y="696" font-size="10.5" fill="#7E9187">native WS · Apollo compatible</text>

  <g stroke="#2FCF88" stroke-width="1.6">
    <line x1="296" y1="686" x2="348" y2="686" marker-end="url(#aGreen)"/>
    <line x1="536" y1="686" x2="588" y2="686" marker-end="url(#aGreen)"/>
    <line x1="876" y1="686" x2="928" y2="686" marker-end="url(#aGreen)"/>
  </g>

  <!-- footer note -->
  <text x="620" y="752" font-size="11" fill="#7E9187" text-anchor="middle">The control plane is never in the data path. Remove the agent key and the same binary runs fully standalone.</text>

  <!-- outer caption -->
  <text x="620" y="810" font-size="11" fill="#5C6B62" text-anchor="middle">Open-core engine · optional managed fleet</text>
</svg>
