<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter,ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="bloom" cx="0.2" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#2fcf88" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#2fcf88" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#2fcf88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e8f60"/>
      <stop offset="1" stop-color="#50dca0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2fcf88" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dm"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
      .lbl{fill:#ecf5f0;font-size:17px;font-weight:600}
      .sub{fill:#7f948a;font-size:12px}
      .num{fill:#d9f5e8;font-size:16px;font-weight:700}
      .meta{fill:#7f948a;font-size:12.5px}
      .cap{fill:#5c6f66;font-size:11.5px;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1200" height="675" rx="22" fill="#0b120f" stroke="#1c2a23" stroke-width="1.5"/>
  <rect width="1200" height="675" rx="22" fill="url(#bloom)"/>
  <rect width="1200" height="675" rx="22" fill="url(#dots)" mask="url(#dm)"/>

  <!-- header -->
  <text x="46" y="62" fill="#f2f8f5" font-size="30" font-weight="800" letter-spacing="-0.01em">50,000,000 docs, bootstrapped</text>
  <text x="46" y="90" fill="#7f948a" font-size="15">VentStream · every source → OpenSearch · engine capped at 2 vCPU / 1 GiB</text>
  <rect x="940" y="38" width="214" height="30" rx="15" fill="#0f1a15" stroke="#233b30"/>
  <circle cx="960" cy="53" r="3.5" fill="#2fcf88"/><circle cx="960" cy="53" r="7" fill="#2fcf88" opacity="0.2"/>
  <text x="974" y="58" class="mono" fill="#9fb5aa" font-size="12">counts verified exact</text>

  <!-- bars: throughput events/s, scale 133383 → 720px -->
  <!-- MongoDB -->
  <text x="46" y="152" class="lbl">MongoDB</text><text x="46" y="170" class="sub mono">change streams</text>
  <rect x="200" y="134" width="720" height="30" rx="8" fill="#101a15" stroke="#233b30" stroke-width="1"/>
  <rect x="200" y="134" width="720" height="30" rx="8" fill="url(#bar)"/>
  <text x="932" y="155" class="num mono">133,383/s</text>
  <text x="1048" y="150" class="meta mono">6.2 min</text><text x="1048" y="166" class="meta mono">237 MiB</text>

  <!-- PostgreSQL -->
  <text x="46" y="222" class="lbl">PostgreSQL</text><text x="46" y="240" class="sub mono">logical replication</text>
  <rect x="200" y="204" width="720" height="30" rx="8" fill="#101a15" stroke="#233b30" stroke-width="1"/>
  <rect x="200" y="204" width="691" height="30" rx="8" fill="url(#bar)"/>
  <text x="903" y="225" class="num mono">128,059/s</text>
  <text x="1048" y="220" class="meta mono">6.5 min</text><text x="1048" y="236" class="meta mono">253 MiB</text>

  <!-- Neo4j -->
  <text x="46" y="292" class="lbl">Neo4j</text><text x="46" y="310" class="sub mono">graph scan · bolt</text>
  <rect x="200" y="274" width="720" height="30" rx="8" fill="#101a15" stroke="#233b30" stroke-width="1"/>
  <rect x="200" y="274" width="680" height="30" rx="8" fill="url(#bar)"/>
  <text x="892" y="295" class="num mono">~126,000/s</text>
  <text x="1048" y="290" class="meta mono">6.6 min</text><text x="1048" y="306" class="meta mono">347 MiB</text>

  <!-- Kafka -->
  <text x="46" y="362" class="lbl">Kafka</text><text x="46" y="380" class="sub mono">redpanda · raw topic</text>
  <rect x="200" y="344" width="720" height="30" rx="8" fill="#101a15" stroke="#233b30" stroke-width="1"/>
  <rect x="200" y="344" width="612" height="30" rx="8" fill="url(#bar)"/>
  <text x="824" y="365" class="num mono">113,381/s</text>
  <text x="1048" y="360" class="meta mono">7.3 min</text><text x="1048" y="376" class="meta mono">376 MiB</text>

  <!-- MySQL -->
  <text x="46" y="432" class="lbl">MySQL</text><text x="46" y="450" class="sub mono">row-based binlog</text>
  <rect x="200" y="414" width="720" height="30" rx="8" fill="#101a15" stroke="#233b30" stroke-width="1"/>
  <rect x="200" y="414" width="502" height="30" rx="8" fill="url(#bar)"/>
  <text x="714" y="435" class="num mono">92,973/s</text>
  <text x="1048" y="430" class="meta mono">9.0 min</text><text x="1048" y="446" class="meta mono">109 MiB</text>

  <!-- column captions -->
  <text x="1048" y="120" class="cap">TIME · PEAK RSS</text>

  <!-- footer stats band -->
  <line x1="46" y1="492" x2="1154" y2="492" stroke="#1c2a23"/>
  <g>
    <text x="46" y="540" fill="#d9f5e8" font-size="26" font-weight="800">0</text>
    <text x="46" y="562" class="meta">gaps or duplicates</text>
    <text x="266" y="540" fill="#d9f5e8" font-size="26" font-weight="800">≤ 376 MiB</text>
    <text x="266" y="562" class="meta">peak engine memory (1 GiB cap)</text>
    <text x="586" y="540" fill="#d9f5e8" font-size="26" font-weight="800">6–9 min</text>
    <text x="586" y="562" class="meta">full 50M bootstrap, per source</text>
    <text x="866" y="540" fill="#d9f5e8" font-size="26" font-weight="800">250M</text>
    <text x="866" y="562" class="meta">docs verified across 5 sources</text>
  </g>
  <text x="46" y="622" class="cap">Every run checked document-by-document against the source count. Single engine binary, laptop-class shared hardware — production numbers run higher.</text>
  <text x="46" y="644" class="cap mono">ventstream.dev · Aug 2026</text>
</svg>
