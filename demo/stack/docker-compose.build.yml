# Opt-in override: build the engine from this checkout instead of pulling
# the published image.
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  engine-orders:
    build:
      context: ../..
      dockerfile: infra/docker/engine.Dockerfile
    image: ventstream-engine:demo
  engine-products:
    build:
      context: ../..
      dockerfile: infra/docker/engine.Dockerfile
    image: ventstream-engine:demo
