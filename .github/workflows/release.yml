name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ventstream/ventstream
  EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_epoch: ${{ steps.release.outputs.source_epoch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master on 2026-07-11
        with:
          toolchain: 1.94.0
      - name: Preflight GitHub release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          if response=$(gh api "$endpoint" 2>&1); then
            test "$(printf '%s' "$response" | jq -r '.draft')" = "true" || {
              echo "refusing to modify an already-published GitHub release" >&2
              exit 1
            }
          else
            case "$response" in
              *"HTTP 404"*) ;;
              *)
                echo "could not determine whether the GitHub release already exists" >&2
                printf '%s\n' "$response" >&2
                exit 1
                ;;
            esac
          fi
      - name: Validate release contract
        id: release
        env:
          RELEASE_REQUIRE_MAIN: "1"
        run: |
          ./infra/release/validate-release.sh "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

  image:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
          cache-binary: false
      - name: Build platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_epoch }}
        with:
          context: .
          file: infra/docker/engine.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=VentStream
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p evidence
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg platform "$PLATFORM" \
            '{image: $image, digest: $digest, platform: $platform}' \
            > "evidence/image-digest-$SLUG.json"
      - name: Smoke-test runtime image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          actual=$(docker run --rm --platform "$PLATFORM" "$IMAGE@$DIGEST" --version)
          test "$actual" = "ventstream $EXPECTED_VERSION"
      - name: Generate retained vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.72.0
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: evidence/trivy-ventstream-${{ matrix.slug }}.json
          exit-code: "0"
          timeout: 15m0s
          trivyignores: .trivyignore.yaml
      - name: Enforce zero high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"
          timeout: 15m0s
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml
      - name: Generate platform SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          syft-version: v1.46.0
          output-file: evidence/ventstream-${{ matrix.slug }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify application dependencies are present in the SBOM
        env:
          SBOM: evidence/ventstream-${{ matrix.slug }}.spdx.json
        run: |
          jq -e '
            [.packages[].externalRefs[]?
              | select(.referenceType == "purl")
              | .referenceLocator
              | select(startswith("pkg:cargo/"))]
            | length > 0
          ' "$SBOM" >/dev/null
      - name: Attest platform provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          push-to-registry: true
      - name: Attest platform SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          sbom-path: evidence/ventstream-${{ matrix.slug }}.spdx.json
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify platform image
        env:
          SUBJECT: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$SUBJECT"
          cosign verify \
            --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            "$SUBJECT" >/dev/null
      - name: Retain platform release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.slug }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 90
      - name: Pass verified digest to manifest assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.slug }}
          path: evidence/image-digest-${{ matrix.slug }}.json
          retention-days: 1

  native-binary:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-amd64
            runner: ubuntu-22.04
          - artifact: linux-arm64
            runner: ubuntu-22.04-arm
          - artifact: darwin-amd64
            runner: macos-15-intel
          - artifact: darwin-arm64
            runner: macos-15
          - artifact: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master on 2026-07-11
        with:
          toolchain: 1.94.0
      - name: Install Linux native build dependencies
        if: startsWith(matrix.artifact, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev pkg-config
      # aws-lc-sys assembles with NASM under windows-msvc.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.artifact, 'windows-')
      - name: Install auditable build tool
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-auditable@0.7.5
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build auditable engine binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.artifact, 'darwin-') && '12.0' || '' }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_epoch }}
        run: cargo auditable build --release --locked -p ventstream
      - name: Verify binary version and standalone configuration
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          VS_ENGINE_CONFIG: examples/standalone/ventstream.yaml
          VS_OS_ENDPOINT: http://127.0.0.1:9200
          VS_PG_DATABASE: ventstream
          VS_PG_HOST: 127.0.0.1
          VS_PG_PASSWORD: local-validation-only
          VS_PG_PUBLICATION: ventstream_publication
          VS_PG_SLOT: ventstream_slot
          VS_PG_USER: ventstream
        run: |
          BIN=target/release/ventstream
          [ -e "$BIN.exe" ] && BIN="$BIN.exe"
          test "$("$BIN" --version)" = "ventstream $EXPECTED_VERSION"
          "$BIN" --validate-config \
            | grep -Fx 'configuration valid: roles=cdc'
      - name: Strip engine binary
        if: ${{ !startsWith(matrix.artifact, 'windows-') }}
        run: strip target/release/ventstream
      - name: Prepare native archive
        id: package
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist/package
          if [[ "$ARTIFACT" == windows-* ]]; then
            archive="ventstream-$VERSION-$ARTIFACT.zip"
            cp target/release/ventstream.exe dist/package/ventstream.exe
            cp examples/standalone/ventstream.yaml dist/package/ventstream.example.yaml
            cp infra/release/BINARY_README.md dist/package/README.md
            (cd dist/package && 7z a "../$archive" \
              ventstream.exe ventstream.example.yaml README.md >/dev/null)
          else
            archive="ventstream-$VERSION-$ARTIFACT.tar.gz"
            install -m 0755 target/release/ventstream dist/package/ventstream
            install -m 0644 examples/standalone/ventstream.yaml \
              dist/package/ventstream.example.yaml
            install -m 0644 infra/release/BINARY_README.md dist/package/README.md
            tar -czf "dist/$archive" -C dist/package \
              ventstream ventstream.example.yaml README.md
          fi
          rm -rf dist/package
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Generate native binary SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ startsWith(matrix.artifact, 'windows-') && 'target/release/ventstream.exe' || 'target/release/ventstream' }}
          format: spdx-json
          syft-version: v1.46.0
          output-file: dist/ventstream-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify application dependencies are present in the SBOM
        env:
          SBOM: dist/ventstream-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}.spdx.json
        run: |
          jq -e '
            [.packages[].externalRefs[]?
              | select(.referenceType == "purl")
              | .referenceLocator
              | select(startswith("pkg:cargo/"))]
            | length > 0
          ' "$SBOM" >/dev/null
      - name: Attest native archive provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
      - name: Attest native archive SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
          sbom-path: dist/ventstream-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}.spdx.json
      - name: Retain native release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.artifact }}
          path: dist/*
          retention-days: 90

  native-installer:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test native installer
        run: |
          sh -n install.sh
          ./infra/release/test-installer.sh
      - name: Parse Windows installer
        run: |
          pwsh -NoProfile -Command \
            '$tokens = $errors = $null; \
             [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null; \
             if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
      - name: Prepare installer release assets
        run: |
          mkdir -p dist
          install -m 0755 install.sh dist/ventstream-installer.sh
          install -m 0644 install.ps1 dist/ventstream-installer.ps1
      - name: Attest installer provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/ventstream-installer.sh
      - name: Attest Windows installer provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/ventstream-installer.ps1
      - name: Retain installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-installer
          path: |
            dist/ventstream-installer.sh
            dist/ventstream-installer.ps1
          retention-days: 90

  publish-image:
    needs: [validate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download verified platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
          cache-binary: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Log Helm in to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight immutable chart reference
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          chart_ref="oci://ghcr.io/ventstream/charts/ventstream-gateway"
          if inspect_output=$(helm show chart "$chart_ref" --version "$VERSION" 2>&1); then
            echo "refusing to overwrite existing chart $chart_ref:$VERSION" >&2
            exit 1
          fi
          case "$inspect_output" in
            *"not found"*|*"manifest unknown"*) ;;
            *)
              echo "could not prove release chart reference is absent: $chart_ref:$VERSION" >&2
              printf '%s\n' "$inspect_output" >&2
              exit 1
              ;;
          esac
      - name: Publish immutable multi-architecture manifest
        id: manifest
        run: |
          ./infra/release/publish-image-manifest.sh \
            "$IMAGE" \
            "${GITHUB_REF_NAME#v}" \
            "$GITHUB_SHA" \
            evidence/image-digests.txt \
            digests/image-digest-linux-amd64.json \
            digests/image-digest-linux-arm64.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify release manifest
        env:
          SUBJECT: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes "$SUBJECT"
          cosign verify \
            --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            "$SUBJECT" >/dev/null
      - name: Attest release manifest provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          push-to-registry: true
      - name: Retain release manifest digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-index
          path: evidence/image-digests.txt
          retention-days: 90

  chart:
    needs: [validate, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Log Helm in to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Cosign in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish gateway chart
        id: chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          chart_ref="oci://ghcr.io/ventstream/charts/ventstream-gateway"
          if inspect_output=$(helm show chart "$chart_ref" --version "$VERSION" 2>&1); then
            echo "refusing to overwrite existing chart $chart_ref:$VERSION" >&2
            exit 1
          fi
          case "$inspect_output" in
            *"not found"*|*"manifest unknown"*) ;;
            *)
              echo "could not prove release chart reference is absent: $chart_ref:$VERSION" >&2
              printf '%s\n' "$inspect_output" >&2
              exit 1
              ;;
          esac
          helm lint infra/helm/ventstream-gateway
          helm package infra/helm/ventstream-gateway --destination dist
          push_output=$(helm push "dist/ventstream-gateway-$VERSION.tgz" oci://ghcr.io/ventstream/charts 2>&1)
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$digest"
          printf 'ghcr.io/ventstream/charts/ventstream-gateway@%s\n' "$digest" >dist/chart-digests.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify gateway chart
        run: |
          subject=$(cat dist/chart-digests.txt)
          cosign sign --yes "$subject"
          cosign verify \
            --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            "$subject" >/dev/null
      - name: Attest OCI gateway chart provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/ventstream/charts/ventstream-gateway
          subject-digest: ${{ steps.chart.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          push-to-registry: true
      - name: Attest packaged chart
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/ventstream-gateway-${{ needs.validate.outputs.version }}.tgz
      - name: Retain chart artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-chart
          path: dist/*
          retention-days: 90

  github-release:
    needs: [validate, publish-image, chart, native-binary, native-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download retained release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>/dev/null); then
            test "$(printf '%s' "$release_json" | jq -r '.draft')" = "true" || {
              echo "refusing to modify an already-published release" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "VentStream $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
