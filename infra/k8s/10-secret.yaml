# DEPRECATED MIGRATION REFERENCE. This manifest uses the retired API-key
# telemetry control plane and is not a current standalone or Fleet deployment.
# Follow docs-site/deploy/kubernetes-standalone.mdx or use the managed-agent chart.
#
# Historical per-agent secrets included a retired control-plane API key alongside
# source credentials and the Neo4j Bolt CA certificate. This template is only for
# interpreting or migrating an old installation; never mint or deploy this API-key
# pattern for a new installation.
#
# Quick-create for a test cluster:
#   kubectl -n ventstream-agents create secret generic orders-agent-secrets \
#     --from-literal=VS_CONTROL_PLANE_KEY='vsk_...' \
#     --from-literal=VS_PG_PASSWORD='...'
#
#   kubectl -n ventstream-agents create secret generic products-agent-secrets \
#     --from-literal=VS_CONTROL_PLANE_KEY='vsk_...' \
#     --from-literal=VS_NEO4J_PASSWORD='...' \
#     --from-file=neo4j-ca.crt=/path/to/bolt/public.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-agent-secrets
  namespace: ventstream-agents
type: Opaque
stringData:
  VS_CONTROL_PLANE_KEY: "vsk_REPLACE_ME"
  VS_PG_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: products-agent-secrets
  namespace: ventstream-agents
type: Opaque
stringData:
  VS_CONTROL_PLANE_KEY: "vsk_REPLACE_ME"
  VS_NEO4J_PASSWORD: "REPLACE_ME"
  # The Bolt server CA cert, so rustls-native-certs trusts the TLS
  # handshake. For the local demo this is vs-neo4j's /ssl/bolt/public.crt.
  neo4j-ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_PEM
    -----END CERTIFICATE-----
